<article class="card" [class.urgent]="urgent()">
  <header class="card-head">
    <span class="ticket-id">#{{ ticket().id }}</span>
    @if (urgent()) {
      <span class="tag-urgent">dringend</span>
    }
  </header>

  <h3 class="card-title">{{ ticket().title }}</h3>

  <div class="meta">
    <span class="prio" [attr.data-priority]="ticket().priority">{{ priorityText() }}</span>
    <span class="assignee">{{ assignee() }}</span>
  </div>

  <footer class="actions">
    <a class="btn btn-ghost" [routerLink]="['/tickets', ticket().id]">Öffnen</a>
    @switch (ticket().status) {
      @case ('offen') {
        <button type="button" class="btn" (click)="statusChange.emit('in Arbeit')">In Arbeit →</button>
      }
      @case ('in Arbeit') {
        <button type="button" class="btn" (click)="statusChange.emit('offen')">← Offen</button>
        <button type="button" class="btn" (click)="statusChange.emit('erledigt')">Erledigt →</button>
      }
      @case ('erledigt') {
        <button type="button" class="btn" (click)="statusChange.emit('in Arbeit')">← In Arbeit</button>
      }
    }
  </footer>
</article>
